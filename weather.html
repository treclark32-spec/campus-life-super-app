
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Weather | Campus Life</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Campus Life</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="weather.html">Weather</a></li>
                    <li class="nav-item"><a class="nav-link" href="api.html">API Info</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Weather Introduction -->
    <header class="welcome-section text-center">
        <div class="container">
            <h1>LaGrange Campus Weather</h1>
            <p class="lead">Check local weather conditions before heading to class.</p>
        </div>
    </header>

    <!-- Weather Information -->
    <main class="container my-5">
        <div class="card shadow-sm mx-auto text-center" style="max-width: 600px;">
            <div class="card-body p-5">
                <h2>Current Weather</h2>
                <p class="text-muted">LaGrange, Georgia</p>

                <h3 id="temperature" class="display-3 fw-bold">--°F</h3>
                <p id="weatherDescription">Weather information will appear here.</p>

                <p id="windSpeed">Wind: -- mph</p>
                <p id="humidity">Humidity: --%</p>

                <button id="weatherButton" class="btn btn-primary mt-3">
                    Get Current Weather
                </button>

                <p id="weatherStatus" class="mt-3" aria-live="polite"></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">Campus Life Super App | LaGrange College | 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
